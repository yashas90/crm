# Config-as-code for the Railway "crm" API service.
# Dashboard Build settings are locked to this file ("value is set in /railway.toml").
# Redeploy trigger: dialing-pad feature 2026-08-26b (harden migration)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/Dockerfile",
  "/.dockerignore",
  "/railway.toml",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/scripts/**",
  "/packages/db/**",
  "/packages/types/**",
  "/packages/config/**",
  "/apps/api/**",
]

[deploy]
# Migrate before the new replica receives traffic, so start can bind PORT immediately.
preDeployCommand = ["pnpm db:migrate"]
startCommand = "pnpm --filter @propninja/api start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
