# Render Blueprint — alternative to Railway for API + Postgres.
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
services:
  - type: web
    name: propninja-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install && pnpm railway:build
    startCommand: pnpm railway:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: propninja-db
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: ALLOW_DEMO_AUTH
        value: "false"
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: propninja-db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
